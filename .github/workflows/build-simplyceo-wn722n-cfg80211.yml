name: Build HG553 SimplyCEO RTL8188EUS cfg80211 monitor candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-simplyceo-wn722n-cfg80211.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget xz-utils python3 binutils kmod bc flex bison rsync libncurses5-dev gawk unzip file

      - name: Download pinned OpenWrt SDK and source
        run: |
          set -eux
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/openwrt-sdk-23.05.5-bcm63xx-smp_gcc-12.3.0_musl.Linux-x86_64.tar.xz -O sdk.tar.xz
          echo "1e456d67b094eb97f9171a5daf8c8c48ac3dfdf708eea8b70b0e79f6cfe08c28  sdk.tar.xz" | sha256sum -c -
          mkdir sdk
          tar -xJf sdk.tar.xz --strip-components=1 -C sdk
          git clone --depth 1 --branch v23.05.5 https://github.com/openwrt/openwrt.git openwrt
          cp -a sdk/staging_dir openwrt/

      - name: Configure exact HG553 kernel ABI
        run: |
          set -eux
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/config.buildinfo -O openwrt/.config
          echo "113ca8c3e750541802c72d73b0849dabc995e44c6c6feec90433943a4be9f0ed  openwrt/.config" | sha256sum -c -
          echo "CONFIG_BUILDBOT=y" >> openwrt/.config
          echo "CONFIG_TARGET_bcm63xx=y" >> openwrt/.config
          echo "CONFIG_TARGET_bcm63xx_smp=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-cfg80211=m" >> openwrt/.config
          ./openwrt/scripts/feeds update -a
          ./openwrt/scripts/feeds install -a
          make -C openwrt defconfig
          grep -q '^CONFIG_BUILDBOT=y$' openwrt/.config
          grep -q '^CONFIG_TARGET_bcm63xx=y$' openwrt/.config
          grep -q '^CONFIG_TARGET_bcm63xx_smp=y$' openwrt/.config
          # Replace the incomplete SDK toolchain staging tree with the complete
          # official release toolchain, including compiler binaries and runtime libs.
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/openwrt-toolchain-23.05.5-bcm63xx-smp_gcc-12.3.0_musl.Linux-x86_64.tar.xz -O toolchain.tar.xz
          echo "91bd40228ef66a920a6ee4c35ab9d588fc211c36fb90ec855abbe99c21769968  toolchain.tar.xz" | sha256sum -c -
          mkdir toolchain-extract
          tar -xJf toolchain.tar.xz -C toolchain-extract
          TOOLCHAIN_SRC="$(find toolchain-extract -type d -name 'toolchain-mips_mips32_gcc-12.3.0_musl' -print -quit)"
          test -n "$TOOLCHAIN_SRC"
          test -x "$TOOLCHAIN_SRC/bin/mips-openwrt-linux-musl-gcc"
          test -e "$TOOLCHAIN_SRC/lib/ld-musl-mips-sf.so.1"
          TOOLCHAIN_DIR="$PWD/openwrt/staging_dir/toolchain-mips_mips32_gcc-12.3.0_musl"
          cp -a "$TOOLCHAIN_SRC"/. "$TOOLCHAIN_DIR"/
          TOOLCHAIN_STAMP="$TOOLCHAIN_DIR/stamp/.ver_check"
          test -d "$(dirname "$TOOLCHAIN_STAMP")"
          git -C openwrt log --format=%h -1 toolchain > "$TOOLCHAIN_STAMP"
          TOOLCHAIN_BIN="$TOOLCHAIN_DIR/bin"
          test -x "$TOOLCHAIN_BIN/mips-openwrt-linux-musl-gcc"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          command -v mips-openwrt-linux-musl-gcc
          make -C openwrt target/linux/compile V=s
          make -C openwrt package/kernel/mac80211/compile V=s
          # OpenWrt merges the backports symbol table into symvers/mac80211.symvers
          # and removes the temporary Module.symvers during package cleanup.
          CFG80211_SYMVERS="$(find openwrt/build_dir -type f \( -name Module.symvers -o -name '*.symvers' \) | while read f; do grep -q 'cfg80211_rx_mgmt_khz' "$f" && { echo "$f"; break; }; done)"
          test -n "$CFG80211_SYMVERS" || { echo "::error::Could not find any symbol table exporting cfg80211_rx_mgmt_khz."; find openwrt/build_dir -type f \( -name Module.symvers -o -name '*.symvers' \) -print; exit 1; }
          echo "Using cfg80211 symbol table: $CFG80211_SYMVERS"
          echo "CFG80211_SYMVERS=$PWD/$CFG80211_SYMVERS" >> "$GITHUB_ENV"
          KERNEL_MAKEFILE="$(find openwrt/build_dir -type f -path '*/linux-5.15.167/Makefile' -print -quit)"
          test -n "$KERNEL_MAKEFILE"
          KDIR="$(dirname "$KERNEL_MAKEFILE")"
          test -f "$KDIR/Module.symvers"
          test -f "$KDIR/include/generated/autoconf.h"
          ACTUAL_ABI="$(cat "$KDIR/.vermagic")"
          EXPECTED_ABI="f43cfd6bab68f84c8aed9cf42bde33e6"
          echo "Expected kernel ABI: $EXPECTED_ABI"
          echo "Actual kernel ABI:   $ACTUAL_ABI"
          test "$ACTUAL_ABI" = "$EXPECTED_ABI" || { echo "::error::Kernel ABI mismatch; refusing to build."; exit 1; }
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"

      - name: Fetch pinned SimplyCEO RTL8188EUS source
        run: |
          set -eux
          git init driver
          git -C driver remote add origin https://github.com/SimplyCEO/rtl8188eus.git
          git -C driver fetch --depth 1 origin 491f34d1e7e40b6ca3ef91dc9b6563faca01d961
          git -C driver checkout --detach FETCH_HEAD
          grep -Fq 'USB_DEVICE(0x2357, 0x010c)' driver/os_dep/linux/usb_intf.c
          grep -q '^CONFIG_RTL8188E = y' driver/Makefile
          grep -q '^CONFIG_USB_HCI = y' driver/Makefile
          grep -q '^CONFIG_WIFI_MONITOR = y' driver/Makefile
          sed -i 's/^CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' driver/Makefile
          sed -i 's/^CONFIG_PLATFORM_MIPS_PLM = n/CONFIG_PLATFORM_MIPS_PLM = y/' driver/Makefile
          grep -q '^CONFIG_PLATFORM_MIPS_PLM = y' driver/Makefile
          grep -q '^CONFIG_PLATFORM_I386_PC = n' driver/Makefile
          git -C driver rev-parse HEAD | tee driver-source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("driver/Makefile")
          s = p.read_text()
          old = "ifeq ($(CONFIG_PLATFORM_MIPS_PLM), y)\nEXTRA_CFLAGS += -DCONFIG_BIG_ENDIAN"
          new = "ifeq ($(CONFIG_PLATFORM_MIPS_PLM), y)\nEXTRA_CFLAGS += -DCONFIG_BIG_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT"
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one MIPS_PLM platform block; refusing unsafe patch")
          p.write_text(s.replace(old, new))
          PY
          grep -A2 '^ifeq ($(CONFIG_PLATFORM_MIPS_PLM)' driver/Makefile
          grep -q 'CONFIG_IOCTL_CFG80211' driver/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("driver/include/ieee80211.h")
          s = p.read_text()
          names = ("is_multicast_mac_addr", "is_broadcast_mac_addr", "is_zero_mac_addr")
          for name in names:
              old = f"extern __inline int {name}("
              new = f"static __inline int {name}("
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one legacy definition for {name}; refusing unsafe patch")
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -nE 'static __inline int is_(multicast|broadcast|zero)_mac_addr' driver/include/ieee80211.h
          python3 - <<'PY'
          from pathlib import Path
          p = Path("driver/os_dep/linux/usb_intf.c")
          s = p.read_text()
          anchor = "MODULE_DEVICE_TABLE(usb, rtw_usb_id_tbl);"
          if s.count(anchor) != 1:
              raise SystemExit("Expected exactly one USB device table export; refusing unsafe patch")
          guard = """#ifndef CONFIG_RTL8188E
          #error "CONFIG_RTL8188E must be enabled for the WN722N USB table"
          #endif
          MODULE_ALIAS("usb:v2357p010Cd*dc*dsc*dp*ic*isc*ip*in*");"""
          s = s.replace(anchor, anchor + "\n" + guard, 1)
          p.write_text(s)
          PY
          grep -Fq 'USB_DEVICE(0x2357, 0x010c)' driver/os_dep/linux/usb_intf.c
          grep -Fq 'MODULE_ALIAS("usb:v2357p010Cd*dc*dsc*dp*ic*isc*ip*in*")' driver/os_dep/linux/usb_intf.c

      - name: Compile without installing or loading
        run: |
          set -eux
          CC="$(command -v mips-openwrt-linux-musl-gcc)"
          CROSS_COMPILE="${CC%gcc}"
          STAGING_DIR="$PWD/sdk/staging_dir" KBUILD_EXTRA_SYMBOLS="$CFG80211_SYMVERS" make -C "$KDIR" M="$PWD/driver" ARCH=mips CROSS_COMPILE="$CROSS_COMPILE" CONFIG_RTL8188EU=m KCFLAGS="-fcommon -DCONFIG_RTL8188E" modules V=1 2>&1 | tee build.log
          test -f driver/8188eu.ko
          grep -q -- '-DCONFIG_IOCTL_CFG80211' build.log
          grep -q -- '-DCONFIG_WIFI_MONITOR' build.log
          mkdir -p output
          cp driver/8188eu.ko output/
          cp build.log driver-source-commit.txt output/

      - name: Static checks only
        run: |
          set -eux
          modinfo output/8188eu.ko | tee output/modinfo.txt
          modinfo -F alias output/8188eu.ko | tee output/aliases.txt
          grep -Fqi 'usb:v2357p010Cd*dc*dsc*dp*ic*isc*ip*in*' output/aliases.txt
          grep -Fqi 'usb:v2357p010C' output/aliases.txt
          modinfo -F vermagic output/8188eu.ko | tee output/vermagic.txt
          grep -q '^5.15.167 ' output/vermagic.txt
          file output/8188eu.ko | tee output/file.txt
          readelf -h output/8188eu.ko | tee output/elf-header.txt
          grep -qi 'big endian' output/elf-header.txt
          grep -Fq "CONFIG_IOCTL_CFG80211" build.log
          grep -Fq "CONFIG_WIFI_MONITOR" build.log
          echo "Static checks passed only. NOT installed or loaded; runtime compatibility is unproven." | tee output/STATUS.txt

      - name: Package build artifact
        run: |
          set -eux
          mkdir -p output/lib/modules/5.15.167
          cp output/8188eu.ko output/lib/modules/5.15.167/
          cat > output/INSTALL.txt <<'EOF'
          Candidate driver: SimplyCEO/rtl8188eus
          Build variant: cfg80211 + nl80211 + monitor mode
          Pinned source commit: 491f34d1e7e40b6ca3ef91dc9b6563faca01d961
          Router target: OpenWrt 23.05.5, bcm63xx/smp, kernel 5.15.167
          Adapter: TP-Link TL-WN722N V2/V3, USB ID 2357:010c
          Monitor-mode and cfg80211/nl80211 build configuration enabled.
          Static checks do NOT establish runtime compatibility.
          Do not load this module on the HG553 without a separate safety review.
          EOF
          tar -czf HG553-SimplyCEO-WN722N-cfg80211-candidate.tar.gz -C output 8188eu.ko modinfo.txt aliases.txt vermagic.txt file.txt elf-header.txt STATUS.txt INSTALL.txt driver-source-commit.txt lib
          sha256sum HG553-SimplyCEO-WN722N-cfg80211-candidate.tar.gz | tee output/SHA256SUMS

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: HG553-SimplyCEO-WN722N-cfg80211-candidate
          path: |
            HG553-SimplyCEO-WN722N-cfg80211-candidate.tar.gz
            output/
          if-no-files-found: error
          retention-days: 14
