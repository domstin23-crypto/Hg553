

name: Build HG553 WiFi driver

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download HG553 kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: hg553-kernel-build
          repository: domstin23-crypto/Hg553
          run-id: 41713172297
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kernel-artifact

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc

      - name: Clone RTL8188EUS driver
        run: |
          git clone --depth 1 https://github.com/aircrack-ng/rtl8188eus.git driver

      - name: Configure build paths
        run: |
          echo "KSRC=$GITHUB_WORKSPACE/kernel-artifact/build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/kernel-artifact/staging_dir/toolchain-mips_mips32_gcc-12.3.0_musl/bin/mips-openwrt-linux-musl-" >> $GITHUB_ENV
      - name: Restore executable permissions
        run: |
          chmod -R u+x kernel-artifact/staging_dir/toolchain-mips_mips32_gcc-12.3.0_musl/bin
          chmod +x kernel-artifact/build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167/scripts/pahole-flags.sh
      - name: Locate kernel files
        run: |
          echo "Searching for Module.symvers..."
          find kernel-artifact -name Module.symvers -print
          echo "Checking compiler..."
          find kernel-artifact -name mips-openwrt-linux-musl-gcc -print

      - name: Build driver
        run: |
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' driver/Makefile
          make -C driver \
            KSRC="$KSRC" \
            ARCH=mips \
            CROSS_COMPILE="$CROSS_COMPILE" \
            modules

      - name: Check driver
        run: |
          find driver -name '*.ko' -print
          test -f driver/8188eu.ko

      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: hg553-8188eu-driver
          path: driver/8188eu.ko
          if-no-files-found: error

