
name: Build HG553 TL-WN722N V2 Driver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            xz-utils \
            python3 \
            kmod \
            binutils

      - name: Download and verify OpenWrt SDK
        run: |
          wget -q \
            https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/openwrt-sdk-23.05.5-bcm63xx-smp_gcc-12.3.0_musl.Linux-x86_64.tar.xz \
            -O sdk.tar.xz

          echo "1e456d67b094eb97f9171a5daf8c8c48ac3dfdf708eea8b70b0e79f6cfe08c28  sdk.tar.xz" \
            | sha256sum -c -

          mkdir sdk

          tar -xJf sdk.tar.xz \
            --strip-components=1 \
            -C sdk

      - name: Download matching HG553 configuration
        run: |
          wget -q \
            https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/config.buildinfo \
            -O config.buildinfo

          echo "113ca8c3e750541802c72d73b0849dabc995e44c6c6feec90433943a4be9f0ed  config.buildinfo" \
            | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import re

          data = Path("config.buildinfo").read_text()

          entries = re.findall(
              r'(?:# )?CONFIG_[A-Za-z0-9_]+(?:=[^\s]+| is not set)',
              data
          )

          if not entries:
              raise SystemExit("ERROR: No valid CONFIG entries found")

          Path("sdk/.config").write_text(
              "\n".join(entries) + "\n"
          )

          print("Extracted", len(entries), "configuration entries")
          PY

          test -s sdk/.config

          echo "Configuration file prepared."

      - name: Download Linux 5.15.167 driver source
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --branch v5.15.167 \
            https://github.com/gregkh/linux.git \
            linux-src

          git -C linux-src sparse-checkout set \
            drivers/staging/r8188eu

          test -f linux-src/drivers/staging/r8188eu/Makefile
          test -f linux-src/drivers/staging/r8188eu/os_dep/usb_intf.c

          grep -qi '0x2357, 0x010c' \
            linux-src/drivers/staging/r8188eu/os_dep/usb_intf.c

          echo "TL-WN722N V2 USB ID confirmed."

      - name: Create RTL8188EU package
        run: |
          mkdir -p sdk/package/kernel/r8188eu

          cat > sdk/package/kernel/r8188eu/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk
          include $(INCLUDE_DIR)/package.mk

          PKG_NAME:=r8188eu
          PKG_RELEASE:=1
          PKG_LICENSE:=GPL-2.0

          PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)-$(PKG_RELEASE)

          R8188EU_SOURCE_DIR:=$(TOPDIR)/../linux-src/drivers/staging/r8188eu

          define KernelPackage/r8188eu
            SUBMENU:=Wireless Drivers
            TITLE:=Realtek RTL8188EU USB WiFi driver
            DEPENDS:=+kmod-usb-core +kmod-cfg80211 +rtl8188eu-firmware
            FILES:=$(PKG_BUILD_DIR)/r8188eu.ko
            AUTOLOAD:=$(call AutoProbe,r8188eu)
          endef

          define KernelPackage/r8188eu/description
            Linux 5.15 driver for TP-Link TL-WN722N V2.
          endef

          define Build/Prepare
            $(INSTALL_DIR) $(PKG_BUILD_DIR)
            $(CP) $(R8188EU_SOURCE_DIR)/* $(PKG_BUILD_DIR)/
          endef

          define Build/Compile
            $(MAKE) -C $(LINUX_DIR) \
              $(KERNEL_MAKE_FLAGS) \
              M="$(PKG_BUILD_DIR)" \
              CONFIG_R8188EU=m \
              modules
          endef

          $(eval $(call KernelPackage,r8188eu))
          EOF

      - name: Configure OpenWrt SDK
        working-directory: sdk
        run: |
          set -eux

          make package/symlinks

          echo 'CONFIG_PACKAGE_kmod-r8188eu=m' >> .config

          make defconfig

          grep -qx 'CONFIG_PACKAGE_kmod-r8188eu=m' .config

          echo "SDK configuration completed."

      - name: Check kernel build files
        working-directory: sdk
        run: |
          set -eux

          KDIR="build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167"

          test -f "$KDIR/Makefile"
          test -f "$KDIR/Module.symvers"
          test -f "$KDIR/include/generated/autoconf.h"

          grep -E 'CONFIG_CFG80211=|CONFIG_USB=' \
            "$KDIR/.config" || true

          echo "Kernel build files found."

      - name: Compile RTL8188EU
        working-directory: sdk
        run: |
          set -eux

          make package/kernel/r8188eu/compile \
            -j1 V=s

      - name: Verify driver module
        working-directory: sdk
        run: |
          set -eux

          KO="$(find build_dir -type f -name r8188eu.ko | head -n 1)"

          test -n "$KO"
          test -f "$KO"

          echo "Checking USB device support"

          modinfo -F alias "$KO" | tee aliases.txt

          grep -qi 'usb:v2357p010C' aliases.txt

          echo "Checking firmware"

          modinfo -F firmware "$KO" | tee firmware.txt

          grep -Fq 'rtlwifi/rtl8188eufw.bin' firmware.txt

          mkdir -p ../output

          cp "$KO" ../output/r8188eu.ko

      - name: Verify package and kernel ABI
        working-directory: sdk
        run: |
          set -eux

          IPK="$(find bin -type f -name 'kmod-r8188eu_*.ipk' | head -n 1)"

          test -n "$IPK"
          test -f "$IPK"

          mkdir -p ../output/control

          ar p "$IPK" control.tar.gz \
            | tar -xz -C ../output/control

          cat ../output/control/control

          grep -Fq \
            'kernel (= 5.15.167-1-f43cfd6bab68f84c8aed9cf42bde33e6)' \
            ../output/control/control

          cp "$IPK" ../output/

          echo "Kernel ABI verification passed."

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: HG553-WN722N-V2-r8188eu
          path: output/
          if-no-files-found: error
          retention-days: 14
