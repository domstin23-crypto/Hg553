name: Build HG553 TL-WN722N V2 monitor driver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wn722n-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget xz-utils python3 binutils kmod bc flex bison rsync libncurses5-dev gawk unzip file

      - name: Download OpenWrt SDK and source
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/openwrt-sdk-23.05.5-bcm63xx-smp_gcc-12.3.0_musl.Linux-x86_64.tar.xz -O sdk.tar.xz
          echo "1e456d67b094eb97f9171a5daf8c8c48ac3dfdf708eea8b70b0e79f6cfe08c28  sdk.tar.xz" | sha256sum -c -
          mkdir sdk
          tar -xJf sdk.tar.xz --strip-components=1 -C sdk
          git clone --depth 1 --branch v23.05.5 https://github.com/openwrt/openwrt.git openwrt
          cp -a sdk/staging_dir openwrt/

      - name: Configure and build matching OpenWrt kernel
        run: |
          set -eux
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/bcm63xx/smp/config.buildinfo -O openwrt/.config
          echo "113ca8c3e750541802c72d73b0849dabc995e44c6c6feec90433943a4be9f0ed  openwrt/.config" | sha256sum -c -
          make -C openwrt defconfig
          TOOLCHAIN_BIN="$(dirname "$(find "$PWD/sdk/staging_dir" -name 'mips-openwrt-linux-musl-gcc' -print -quit)")"
          test -d "$TOOLCHAIN_BIN"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          command -v mips-openwrt-linux-musl-gcc
          make -C openwrt target/linux/compile V=s
          KDIR="$(find openwrt/build_dir -type f -path '*/linux-5.15.167/Makefile' -printf '%h\n' -quit)"
          test -n "$KDIR"
          test -f "$KDIR/Module.symvers"
          test -f "$KDIR/include/generated/autoconf.h"
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "Prepared and built kernel directory: $KDIR"

      - name: Download monitor-mode RTL8188EUS driver
        run: |
          git clone --depth 1 --branch v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git driver
          grep -qi '2357' driver/os_dep/linux/usb_intf.c
          grep -q 'CONFIG_WIFI_MONITOR = y' driver/Makefile
          sed -i 's/^CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' driver/Makefile
          sed -i 's/^CONFIG_PLATFORM_MIPS_PLM = n/CONFIG_PLATFORM_MIPS_PLM = y/' driver/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("driver/os_dep/linux/os_intfs.c")
          s = p.read_text()
          old = "#if defined(CONFIG_NET_NS)\n    dev_net_set(ndev, wiphy_net(adapter_to_wiphy(adapter)));"
          new = "#if defined(CONFIG_NET_NS) && defined(CONFIG_IOCTL_CFG80211)\n    dev_net_set(ndev, wiphy_net(adapter_to_wiphy(adapter)));"
          if s.count(old) != 1:
              raise SystemExit("Expected single upstream CONFIG_NET_NS/wiphy_net block; refusing unsafe patch")
          p.write_text(s.replace(old, new))
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("driver/os_dep/linux/usb_intf.c")
          s = p.read_text()
          alias = 'MODULE_ALIAS("usb:v2357p010Cc*dc*dsc*dp*ic*isc*ip*in*");'
          if alias not in s:
              needle = "MODULE_DEVICE_TABLE(usb, rtw_usb_id_tbl);"
              if s.count(needle) != 1:
                  raise SystemExit("Could not safely locate USB module table")
              s = s.replace(needle, needle + "\n" + alias)
              p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("driver/include/ieee80211.h")
          s = p.read_text()
          for name in ("is_multicast_mac_addr", "is_zero_mac_addr"):
              old = "extern __inline int " + name + "("
              new = "static __inline int " + name + "("
              if s.count(old) != 1:
                  raise SystemExit(f"Expected one extern inline definition for {name}; refusing unsafe patch")
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Compile for HG553 kernel
        run: |
          set -eux
          CC="$(command -v mips-openwrt-linux-musl-gcc)"
          test -n "$CC"
          test -x "$CC"
          CROSS_COMPILE="${CC%gcc}"
          STAGING_DIR="$PWD/sdk/staging_dir" make -C "$KDIR" M="$PWD/driver" ARCH=mips CROSS_COMPILE="$CROSS_COMPILE" CONFIG_RTL8188EU=m KCFLAGS=-fcommon modules V=1 2>&1 | tee build.log
          test -f driver/8188eu.ko
          mkdir -p output
          cp driver/8188eu.ko output/
          cp build.log output/

      - name: Verify adapter and kernel metadata
        run: |
          set -eux
          modinfo output/8188eu.ko | tee output/modinfo.txt
          modinfo -F alias output/8188eu.ko | tee output/aliases.txt
          grep -qi 'usb:v2357p010C' output/aliases.txt
          modinfo -F vermagic output/8188eu.ko | tee output/vermagic.txt
          grep -q '^5.15.167 ' output/vermagic.txt
          file output/8188eu.ko | tee output/file.txt
          readelf -h output/8188eu.ko | tee output/elf-header.txt
          grep -qi 'big endian' output/elf-header.txt
          echo "Static checks passed; runtime compatibility still needs router testing." | tee output/VERIFIED.txt

      - name: Package driver bundle
        run: |
          set -eux
          mkdir -p output/lib/modules/5.15.167
          cp output/8188eu.ko output/lib/modules/5.15.167/
          cat > output/INSTALL.txt <<'EOF'
          HG553 OpenWrt 23.05.5 / kernel 5.15.167
          TP-Link TL-WN722N V2 USB ID 2357:010c
          Aircrack-ng RTL8188EUS driver with monitor configuration
          Static checks do not guarantee runtime operation.
          Do not install if the router kernel ABI differs.
          EOF
          tar -czf HG553-WN722N-V2-monitor-driver.tar.gz -C output 8188eu.ko modinfo.txt aliases.txt vermagic.txt INSTALL.txt lib
          sha256sum HG553-WN722N-V2-monitor-driver.tar.gz > output/SHA256SUMS

      - name: Upload driver bundle
        uses: actions/upload-artifact@v4
        with:
          name: HG553-WN722N-V2-monitor-driver
          path: |
            HG553-WN722N-V2-monitor-driver.tar.gz
            output/
          if-no-files-found: error
          retention-days: 14
