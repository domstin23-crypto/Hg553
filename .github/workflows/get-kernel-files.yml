
name: Prepare HG553 kernel build
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          make defconfig
          echo "CONFIG_TARGET_bcm63xx=y" >> .config
          echo "CONFIG_TARGET_bcm63xx_smp=y" >> .config
          echo "CONFIG_CFG80211_WEXT=y" >> .config
          echo "CONFIG_WIRELESS_EXT=y" >> .config
          make defconfig
          echo "=== Wireless configuration ==="
          grep -E 'CONFIG_(CFG80211_WEXT|WIRELESS_EXT|WEXT_CORE)=' .config || true
      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s
      - name: Enable Wireless Extensions in kernel
        working-directory: openwrt
        run: |
          CONFIG_FILE=$(find build_dir/target-mips_mips32_musl/linux-bcm63xx_smp \
            -name .config -path '*/linux-5.15.167/.config' | head -n 1)
          if [ -z "$CONFIG_FILE" ]; then
            echo "Kernel .config not found"
            exit 1
          fi
          echo "Kernel config: $CONFIG_FILE"
          ./scripts/config --file "$CONFIG_FILE" \
            -e WIRELESS_EXT \
            -e CFG80211_WEXT \
            -e WEXT_CORE \
            -e WEXT_PRIV \
            -e WEXT_PROC \
            -e WEXT_SPY
          make target/linux/prepare V=s
          grep -E 'CONFIG_(WIRELESS_EXT|CFG80211_WEXT|WEXT_CORE|WEXT_PRIV|WEXT_PROC|WEXT_SPY)=' "$CONFIG_FILE"
      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j2 V=s
          make toolchain/install -j2 V=s
      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile V=s
      - name: Verify wireless symbol
        working-directory: openwrt
        run: |
          grep -w wireless_send_event \
            build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167/Module.symvers
      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: |
            openwrt/build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/
            openwrt/staging_dir/target-mips_mips32_musl/
            openwrt/staging_dir/toolchain-*/
            openwrt/staging_dir/host/bin/
          if-no-files-found: error
          retention-days: 7
