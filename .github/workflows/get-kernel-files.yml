
name: Prepare HG553 kernel build
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          make defconfig
          echo "CONFIG_TARGET_bcm63xx=y" >> .config
          echo "CONFIG_TARGET_bcm63xx_smp=y" >> .config
          make defconfig
      - name: Enable Wireless Extensions
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("target/linux/generic/config-5.15")
          s = p.read_text()
          options = [
              "WEXT_CORE",
              "WEXT_PRIV",
              "WEXT_PROC",
              "WEXT_SPY",
              "WIRELESS_EXT",
          ]
          for option in options:
              disabled = f"# CONFIG_{option} is not set"
              enabled = f"CONFIG_{option}=y"
              if disabled in s:
                  s = s.replace(disabled, enabled, 1)
              elif enabled not in s:
                  s += f"\n{enabled}\n"
          p.write_text(s)
          print("Wireless Extensions configuration:")
          for option in options:
              line = f"CONFIG_{option}=y"
              if line not in s:
                  raise SystemExit(f"Missing {line}")
              print(line)
          PY
      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s
      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j2 V=s
          make toolchain/install -j2 V=s
      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile V=s
      - name: Verify wireless symbol
        working-directory: openwrt
        run: |
          grep -w wireless_send_event \
            build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167/Module.symvers
      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: |
            openwrt/build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/
            openwrt/staging_dir/target-mips_mips32_musl/
            openwrt/staging_dir/toolchain-*/
            openwrt/staging_dir/host/bin/
          if-no-files-found: error
          retention-days: 7
