
name: Prepare HG553 kernel build
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          make defconfig
          echo "CONFIG_TARGET_bcm63xx=y" >> .config
          echo "CONFIG_TARGET_bcm63xx_smp=y" >> .config
          make defconfig
      - name: Enable Wireless Extensions
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("target/linux/generic/config-5.15")
          lines = p.read_text().splitlines()
          options = {
              "CFG80211_WEXT",
              "WEXT_CORE",
              "WEXT_PRIV",
              "WEXT_PROC",
              "WEXT_SPY",
              "WIRELESS_EXT",
          }
          cleaned = []
          for line in lines:
              if any(
                  line.startswith(f"CONFIG_{name}=")
                  or line == f"# CONFIG_{name} is not set"
                  for name in options
              ):
                  continue
              cleaned.append(line)
          cleaned.append("CONFIG_CFG80211_WEXT=y")
          p.write_text("\n".join(cleaned) + "\n")
          print("Enabled CONFIG_CFG80211_WEXT=y")
          PY
      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s
      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j2 V=s
          make toolchain/install -j2 V=s
      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile V=s
      - name: Diagnose wireless configuration
        working-directory: openwrt
        run: |
          KERNEL_DIR="build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167"
          echo "=== Wireless kernel configuration ==="
          grep -E 'CONFIG_(CFG80211|CFG80211_WEXT|WEXT_CORE|WEXT_PRIV|WEXT_PROC|WEXT_SPY)' \
            "$KERNEL_DIR/.config" || true
          echo "=== wireless_send_event symbol ==="
          grep -w wireless_send_event "$KERNEL_DIR/Module.symvers" || true
      - name: Verify wireless symbol
        working-directory: openwrt
        run: |
          KERNEL_DIR="build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167"
          if ! grep -qw wireless_send_event "$KERNEL_DIR/Module.symvers"; then
            echo "ERROR: wireless_send_event is missing."
            exit 1
          fi
          echo "SUCCESS: wireless_send_event is exported."
      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: |
            openwrt/build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/
            openwrt/staging_dir/target-mips_mips32_musl/
            openwrt/staging_dir/toolchain-*/
            openwrt/staging_dir/host/bin/
          if-no-files-found: error
          retention-days: 7
