

name: Prepare HG553 kernel build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04

    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          make defconfig
          echo "CONFIG_TARGET_bcm63xx=y" >> .config
          echo "CONFIG_TARGET_bcm63xx_smp=y" >> .config
          make defconfig

      - name: Enable Wireless Extensions
        working-directory: openwrt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("target/linux/generic/config-5.15")
          lines = p.read_text().splitlines()

          options = {
              "WIRELESS_EXT",
              "WEXT_CORE",
              "WEXT_PROC",
              "WEXT_PRIV",
              "WEXT_SPY",
              "CFG80211_WEXT",
          }

          result = []

          for line in lines:
              remove = False

              for option in options:
                  if (
                      line.startswith(f"CONFIG_{option}=")
                      or line == f"# CONFIG_{option} is not set"
                  ):
                      remove = True
                      break

              if not remove:
                  result.append(line)

          result.append("CONFIG_WIRELESS_EXT=y")

          p.write_text("\n".join(result) + "\n")

          print("Wireless Extensions enabled.")
          PY

      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s

      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j2 V=s
          make toolchain/install -j2 V=s

      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile V=s

      - name: Verify wireless configuration
        working-directory: openwrt
        run: |
          KERNEL_DIR="build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167"

          echo "=== Kernel configuration ==="

          grep -E 'CONFIG_(WIRELESS_EXT|WEXT_CORE|WEXT_PROC)' \
            "$KERNEL_DIR/.config" || true

          echo "=== Checking required configuration ==="

          grep -qx 'CONFIG_WIRELESS_EXT=y' "$KERNEL_DIR/.config"
          grep -qx 'CONFIG_WEXT_CORE=y' "$KERNEL_DIR/.config"

          echo "Wireless Extensions configuration verified."

      - name: Verify wireless_send_event
        working-directory: openwrt
        run: |
          KERNEL_DIR="build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/linux-5.15.167"

          if ! grep -qw wireless_send_event "$KERNEL_DIR/Module.symvers"; then
            echo "ERROR: wireless_send_event is missing."
            exit 1
          fi

          grep -w wireless_send_event "$KERNEL_DIR/Module.symvers"

          echo "SUCCESS: wireless_send_event is exported."

      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: |
            openwrt/build_dir/target-mips_mips32_musl/linux-bcm63xx_smp/
            openwrt/staging_dir/target-mips_mips32_musl/
            openwrt/staging_dir/toolchain-*/
            openwrt/staging_dir/host/bin/
          if-no-files-found: error
          retention-days: 7

