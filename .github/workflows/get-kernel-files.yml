


name: Prepare HG553 kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KVER: "5.15.167"
  KBUILD: target-mips_mips32_musl/linux-bcm63xx_smp

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_bcm63xx=y
          CONFIG_TARGET_bcm63xx_smp=y
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_bcm63xx_smp=y' .config

          echo "HG553 target configuration:"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH)' .config || true

      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s
          test -d "build_dir/$KBUILD/linux-$KVER"

      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

      - name: Enable Wireless Extensions
        working-directory: openwrt
        run: |
          set -eux

          KDIR="$PWD/build_dir/$KBUILD/linux-$KVER"

          CROSS_GCC="$(find "$PWD"/staging_dir/toolchain-*/bin \
            -name 'mips-openwrt-linux-musl-gcc' | head -n 1)"

          test -f "$KDIR/net/wireless/Kconfig"
          test -n "$CROSS_GCC"

          CROSS="${CROSS_GCC%gcc}"

          echo "Kernel directory: $KDIR"
          echo "Cross compiler: $CROSS"

          python3 - "$KDIR/net/wireless/Kconfig" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          pattern = r'(?ms)^config WIRELESS_EXT\n(.*?)(?=^config |\Z)'
          m = re.search(pattern, s)

          if not m:
              raise SystemExit("ERROR: WIRELESS_EXT was not found")

          block = m.group(0)

          if not re.search(r'(?m)^\s*default\s+y\s*$', block):
              bool_match = re.search(r'(?m)^(\s*)bool(?:\s.*)?$', block)

              if not bool_match:
                  raise SystemExit("ERROR: WIRELESS_EXT bool entry was not found")

              insert_at = m.start() + bool_match.end()
              s = s[:insert_at] + "\n\tdefault y" + s[insert_at:]
              p.write_text(s)

          print("WIRELESS_EXT Kconfig entry:")
          updated = p.read_text()
          m = re.search(pattern, updated)
          print(m.group(0))

          if not re.search(r'(?m)^\s*default\s+y\s*$', m.group(0)):
              raise SystemExit("ERROR: Could not set WIRELESS_EXT default y")
          PY

          cat >> "$KDIR/.config" <<'EOF'
          CONFIG_WIRELESS=y
          CONFIG_WIRELESS_EXT=y
          EOF

          make -C "$KDIR" ARCH=mips CROSS_COMPILE="$CROSS" olddefconfig

          echo "=== Wireless kernel configuration ==="

          grep -E '^CONFIG_(WIRELESS|WIRELESS_EXT|WEXT_CORE|WEXT_PROC)=' \
            "$KDIR/.config" || true

          grep -qx 'CONFIG_WIRELESS=y' "$KDIR/.config"
          grep -qx 'CONFIG_WIRELESS_EXT=y' "$KDIR/.config"
          grep -qx 'CONFIG_WEXT_CORE=y' "$KDIR/.config"

          echo "SUCCESS: Wireless Extensions enabled."

      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile -j"$(nproc)" || \
            make target/linux/compile -j1 V=s

      - name: Verify wireless configuration
        working-directory: openwrt
        run: |
          KDIR="build_dir/$KBUILD/linux-$KVER"

          echo "=== Final wireless configuration ==="

          grep -E '^CONFIG_(WIRELESS|WIRELESS_EXT|WEXT_CORE|WEXT_PROC)=' \
            "$KDIR/.config" || true

          grep -qx 'CONFIG_WIRELESS=y' "$KDIR/.config"
          grep -qx 'CONFIG_WIRELESS_EXT=y' "$KDIR/.config"
          grep -qx 'CONFIG_WEXT_CORE=y' "$KDIR/.config"

          echo "SUCCESS: Configuration survived compilation."

      - name: Verify wireless_send_event
        working-directory: openwrt
        run: |
          KDIR="build_dir/$KBUILD/linux-$KVER"

          if ! grep -qw wireless_send_event "$KDIR/Module.symvers"; then
            echo "ERROR: wireless_send_event is missing."
            exit 1
          fi

          grep -w wireless_send_event "$KDIR/Module.symvers"

          echo "SUCCESS: wireless_send_event is exported."

      - name: Package kernel build files
        working-directory: openwrt
        run: |
          tar --zstd -cf ../hg553-kernel-build.tar.zst \
            "build_dir/$KBUILD/linux-$KVER" \
            staging_dir/target-mips_mips32_musl \
            staging_dir/toolchain-* \
            staging_dir/host/bin

          ls -lh ../hg553-kernel-build.tar.zst

      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: hg553-kernel-build.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


