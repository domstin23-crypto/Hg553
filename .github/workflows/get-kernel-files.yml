




name: Prepare HG553 kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KVER: "5.15.167"
  KBUILD: target-mips_mips32_musl/linux-bcm63xx_smp

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_bcm63xx=y
          CONFIG_TARGET_bcm63xx_smp=y
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_bcm63xx_smp=y' .config

          echo "=== HG553 target ==="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH)' .config || true

      - name: Configure kernel wireless support
        working-directory: openwrt
        run: |
          set -eux

          CONFIG_FILE="target/linux/bcm63xx/config-5.15"

          test -f "$CONFIG_FILE"

          sed -i -E \
            '/^(# )?CONFIG_(CFG80211|CFG80211_WEXT|WEXT_CORE)(=| is not set)/d' \
            "$CONFIG_FILE"

          cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          EOF

          echo "=== Requested wireless settings ==="
          grep -E '^CONFIG_(CFG80211|CFG80211_WEXT)=' "$CONFIG_FILE"

      - name: Prepare kernel
        working-directory: openwrt
        run: |
          set -eux

          make target/linux/prepare V=s

          KDIR="$PWD/build_dir/$KBUILD/linux-$KVER"

          test -d "$KDIR"
          echo "Kernel source prepared: $KDIR"

      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile -j"$(nproc)" || \
            make target/linux/compile -j1 V=s

      - name: Verify wireless configuration
        working-directory: openwrt
        run: |
          set -eux

          KDIR="build_dir/$KBUILD/linux-$KVER"

          echo "=== Final wireless configuration ==="

          grep -E '^CONFIG_(CFG80211|CFG80211_WEXT|WEXT_CORE)=' \
            "$KDIR/.config" || true

          grep -qx 'CONFIG_CFG80211=y' "$KDIR/.config"
          grep -qx 'CONFIG_CFG80211_WEXT=y' "$KDIR/.config"
          grep -qx 'CONFIG_WEXT_CORE=y' "$KDIR/.config"

          echo "SUCCESS: wireless configuration enabled."

      - name: Verify wireless_send_event
        working-directory: openwrt
        run: |
          set -eux

          KDIR="build_dir/$KBUILD/linux-$KVER"

          grep -w wireless_send_event "$KDIR/Module.symvers"

          echo "SUCCESS: wireless_send_event is exported."

      - name: Package kernel build files
        working-directory: openwrt
        run: |
          set -eux

          tar --zstd -cf ../hg553-kernel-build.tar.zst \
            "build_dir/$KBUILD/linux-$KVER" \
            staging_dir/target-mips_mips32_musl \
            staging_dir/toolchain-* \
            staging_dir/host/bin

          ls -lh ../hg553-kernel-build.tar.zst

      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: hg553-kernel-build.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0




