

name: Prepare HG553 kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KVER: 5.15.167
  KBUILD: target-mips_mips32_musl/linux-bcm63xx_smp

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Download OpenWrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v23.05.5
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure HG553 target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_bcm63xx=y
          CONFIG_TARGET_bcm63xx_smp=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_bcm63xx_smp=y' .config
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|ARCH)' .config || true

      - name: Prepare kernel
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s
          test -d "build_dir/$KBUILD/linux-$KVER"

      - name: Install OpenWrt toolchain
        working-directory: openwrt
        run: |
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

      - name: Enable Wireless Extensions (fail fast)
        working-directory: openwrt
        run: |
          KDIR="$PWD/build_dir/$KBUILD/linux-$KVER"
          CROSS_GCC="$(find "$PWD"/staging_dir/toolchain-*/bin -name 'mips-openwrt-linux-musl-gcc' | head -n1)"
          CROSS="${CROSS_GCC%gcc}"
          echo "Cross prefix: $CROSS"

          # WIRELESS_EXT has no prompt, so kconfig ignores it unless
          # something selects it. Give it a prompt and default y.
          sed -i '/^config WIRELESS_EXT$/,/^$/ s/^\tbool$/\tbool "Wireless extensions"\n\tdefault y/' \
            "$KDIR/net/wireless/Kconfig"
          sed -n '/^config WIRELESS_EXT$/,/^$/p' "$KDIR/net/wireless/Kconfig"
          grep -A3 '^config WIRELESS_EXT$' "$KDIR/net/wireless/Kconfig" | grep -q 'default y'

          # net/wireless/Kconfig is only read when CONFIG_WIRELESS=y
          cat >> "$KDIR/.config" <<'EOF'
          CONFIG_WIRELESS=y
          CONFIG_WIRELESS_EXT=y
          EOF

          make -C "$KDIR" ARCH=mips CROSS_COMPILE="$CROSS" olddefconfig

          echo "=== Resulting kernel options ==="
          grep -E '^CONFIG_(WIRELESS|WIRELESS_EXT|WEXT_CORE|WEXT_PROC)=' "$KDIR/.config" || true

          grep -qx 'CONFIG_WIRELESS=y' "$KDIR/.config"
          grep -qx 'CONFIG_WIRELESS_EXT=y' "$KDIR/.config"
          grep -qx 'CONFIG_WEXT_CORE=y' "$KDIR/.config"
          echo "Wireless Extensions enabled in kernel .config."

      - name: Compile kernel
        working-directory: openwrt
        run: |
          make target/linux/compile -j"$(nproc)" || make target/linux/compile -j1 V=s

      - name: Verify config survived the build
        working-directory: openwrt
        run: |
          KDIR="build_dir/$KBUILD/linux-$KVER"
          grep -qx 'CONFIG_WIRELESS_EXT=y' "$KDIR/.config"
          grep -qx 'CONFIG_WEXT_CORE=y' "$KDIR/.config"
          echo "Config verified after compile."

      - name: Verify wireless_send_event
        working-directory: openwrt
        run: |
          KDIR="build_dir/$KBUILD/linux-$KVER"
          if ! grep -qw wireless_send_event "$KDIR/Module.symvers"; then
            echo "ERROR: wireless_send_event is missing from Module.symvers."
            exit 1
          fi
          grep -w wireless_send_event "$KDIR/Module.symvers"
          echo "SUCCESS: wireless_send_event is exported."

      - name: Package kernel build files
        working-directory: openwrt
        run: |
          tar --zstd -cf ../hg553-kernel-build.tar.zst \
            "build_dir/$KBUILD/linux-$KVER" \
            staging_dir/target-mips_mips32_musl \
            staging_dir/toolchain-* \
            staging_dir/host/bin
          ls -lh ../hg553-kernel-build.tar.zst

      - name: Save kernel build files
        uses: actions/upload-artifact@v4
        with:
          name: hg553-kernel-build
          path: hg553-kernel-build.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

